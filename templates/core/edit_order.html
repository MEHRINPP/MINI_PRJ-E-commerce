<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Order</title>
    <style>
        /* You can add some styling here to match your app's design */
    </style>
</head>
<body>
    <h1>Edit Order #{{ order.order_id }}</h1>
    
    <form method="post">
        {% csrf_token %}
        <div>
            <label for="order_status">Order Status</label>
            <select name="order_status" id="order_status">
                <option value="Pending" {% if order.order_status == "Pending" %}selected{% endif %}>Pending</option>
                <option value="Processing" {% if order.order_status == "Processing" %}selected{% endif %}>Processing</option>
                <option value="Completed" {% if order.order_status == "Completed" %}selected{% endif %}>Completed</option>
                <option value="Cancelled" {% if order.order_status == "Cancelled" %}selected{% endif %}>Cancelled</option>
            </select>
        </div>

        <div>
            <label for="order_delivered">Delivered</label>
            <input type="checkbox" name="order_delivered" {% if order.order_delivered %}checked{% endif %}>
        </div>

        <div>
            <label for="order_received">Received</label>
            <input type="checkbox" name="order_received" {% if order.order_received %}checked{% endif %}>
        </div>

        <button type="submit">Save Changes</button>
    </form>

    <a href="{% url 'custom_admin_dashboard' %}">Back to Dashboard</a>
</body>
</html>
