<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <!-- Flex container for Categories and Button -->
        <div class="d-flex justify-content-between align-items-center">
            <h3>Categories</h3>
            <a href="{% url 'custom_admin_dashboard' %}" class="btn btn-secondary">Back to Dashboard</a>
        </div>

        <!-- Form for Adding a New Category -->
        <form method="POST" action="{% url 'add_category' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="category_name">Category Name</label>
                <input type="text" class="form-control" id="category_name" name="category_name" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Category</button>
        </form>
        <br>

        <!-- Categories Table -->
        <table class="table">
            <thead>
                <tr>
                    <th>Category Name</th>
                    <th>Product Count</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for data in category_data %}
                    <tr>
                        <td>{{ data.category.category_name }}</td>
                        <td>{{ data.product_count }}</td>
                        <td>
                            <a href="{% url 'edit_category' data.category.id %}" class="btn btn-warning btn-sm">Edit Category</a>
                            <a href="{% url 'delete_category' data.category.id %}" class="btn btn-danger btn-sm">Delete Category</a>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="3">No categories available.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
</body>
</html>
