<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Payment Method</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2 class="text-center my-5">Choose Your Payment Method</h2>
        
        <!-- Display Order Summary -->
        <div class="text-center">
            <p>Total Amount: ${{ order.get_total_price }}</p>
        </div>

        <!-- Payment Options -->
        <div class="d-flex justify-content-center">
            <a href="{% url 'payment_redirect' payment_method='stripe' %}" class="btn btn-primary mx-3">Pay with Stripe</a>
            <a href="{% url 'payment_redirect' payment_method='cod' %}" class="btn btn-secondary mx-3">Cash on Delivery (COD)</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
</body>
</html>
