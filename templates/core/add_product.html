<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Product</title>
    <link href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body>

    <div class="container mt-4">
        <h1>Add New Product</h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- Product Name -->
            <div class="form-group">
                <label for="id_name">Product Name:</label>
                {{ form.name }}
            </div>

            <!-- Category -->
            <div class="form-group">
                <label for="id_category">Category:</label>
                {{ form.category }}
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="id_desc">Description:</label>
                {{ form.desc }}
            </div>

            <!-- Price -->
            <div class="form-group">
                <label for="id_price">Price:</label>
                {{ form.price }}
            </div>

            <!-- Discount Price -->
            <div class="form-group">
                <label for="id_discount_price">Discount Price:</label>
                {{ form.discount_price }}
            </div>

            <!-- Product Available Count -->
            <div class="form-group">
                <label for="id_product_available_count">Product Available Count:</label>
                {{ form.product_available_count }}
            </div>

            <!-- Image -->
            <div class="form-group">
                <label for="id_img">Image:</label>
                {{ form.img }}
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-success">Add Product</button>
        </form>

        <br>
        <a href="{% url 'product_list' %}" class="btn btn-secondary">Back to Product List</a>
    </div>

</body>
</html>
