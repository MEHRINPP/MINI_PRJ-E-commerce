<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if add_product %}Add Product{% else %}Edit Product: {{ product.name }}{% endif %}</title>
</head>
<body>
    <header>
        <h1>{% if add_product %}Add New Product{% else %}Edit Product: {{ product.name }}{% endif %}</h1>
    </header>

    <main>
        <!-- Product Edit or Add Form -->
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}  <!-- Render the form fields -->

            <button type="submit">{% if add_product %}Add Product{% else %}Save changes{% endif %}</button>
        </form>

        <br>
        <a href="{% url 'custom_admin_dashboard' %}">Back to Admin Dashboard</a>
    </main>

    <footer>
        <p>&copy; 2025 Your Company</p>
    </footer>
</body>
</html>
