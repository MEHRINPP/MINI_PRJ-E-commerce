<!DOCTYPE html>
{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Banner</title>
    <link rel="stylesheet" href="{% static 'admin/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'admin/css/dashboard.css' %}">
</head>
<body>
    <div id="content-main">
        <div class="module">
            <h1>Edit Banner</h1>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
            
                <div class="form-group">
                    <label for="id_title">Title:</label>
                    {{ form.title }}  <!-- Dynamically render the title field -->
                </div>
            
                <div class="form-group">
                    <label for="id_subtitle">Subtitle:</label>
                    {{ form.subtitle }}  <!-- Dynamically render the subtitle field -->
                </div>
            
                <div class="form-group">
                    <label>Banner Image:</label><br>
                    <p>Currently: <img src="{{ banner.image.url }}" alt="Current Image" style="max-width: 200px;"></p>
                    {{ form.image }}  <!-- Dynamically render the image upload field -->
                </div>
            
                <div class="form-group">
                    <label>Created At:</label>
                    <p>{{ banner.created_at|date:"b. d, Y, H:i a" }}</p>
                </div>
            
                <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
            </form>
            

            <div class="buttons">
                <a href="{% url 'custom_admin_dashboard' %}" class="button">Back to Admin Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
