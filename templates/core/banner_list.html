<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banners</title>
    <link href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body>

    <div class="container mt-4">
        <h1>Banners</h1>

        <!-- Back to Dashboard Button -->
        <a href="{% url 'custom_admin_dashboard' %}" class="btn btn-secondary mb-3">Back to Dashboard</a>

        <!-- Add New Banner Button -->
        <a href="{% url 'add_banner' %}" class="btn btn-primary mb-3">Add New Banner</a>

        <!-- banner_list.html -->
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Title</th>
            <th>Created At</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for banner in banners %}
            <tr>
                <td>{{ banner.title }}</td>
                <td>{{ banner.created_at|date:"b. d, Y, H:i a" }}</td>
                <td>
                    <a href="{% url 'edit_banner' banner.id %}" class="btn btn-warning btn-sm">Edit</a> |
                    <a href="{% url 'delete_banner' banner.id %}" onclick="return confirm('Are you sure you want to delete this banner?');" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>


    </div>

</body>
</html>
