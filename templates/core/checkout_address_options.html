<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Address</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Select Address</h2>

        <!-- Add New Address Button -->
        <a href="{% url 'checkout_address' %}" class="btn btn-primary">Add New Address</a>

        <!-- Use Existing Address Section -->
        <h4 class="mt-4">Use Existing Address</h4>
        <form method="POST" action="{% url 'select_existing_address' %}">
            {% csrf_token %}
            <div class="form-group">
                {% for address in addresses %}
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="address" id="address{{ address.id }}" value="{{ address.id }}">
                        <label class="form-check-label" for="address{{ address.id }}">
                            {{ address.street_address }}, {{ address.apartment_address }}<br>
                            {{ address.country }}, {{ address.zip_code }}
                        </label>
                    </div>
                {% empty %}
                    <p>No addresses found. Please add a new address.</p>
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-success">Use Selected Address</button>
        </form>

        <!-- Proceed to Checkout Button -->
        <!-- <a href="{% url 'payment_option' %}" class="btn btn-warning mt-4">Proceed to Checkout</a> -->
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
