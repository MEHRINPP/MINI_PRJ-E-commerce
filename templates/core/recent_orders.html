<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Orders</title>
    <link href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body>

    <div class="container mt-4">
        <h1>Recent Orders</h1>

        <!-- Back to Dashboard Button -->
        <a href="{% url 'custom_admin_dashboard' %}" class="btn btn-secondary mb-3">Back to Dashboard</a>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>User</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for order in orders %}
                    <tr>
                        <td>{{ order.order_id }}</td>
                        <td>{{ order.user }}</td>
                        <td>{{ order.order_status }}</td>
                        <td>{{ order.ordered_date }}</td>
                        <td>
                            <a href="{% url 'edit_order' order.id %}" class="btn btn-warning btn-sm">Edit</a> |
                            <a href="{% url 'delete_order' order.id %}" onclick="return confirm('Are you sure you want to delete this order?');" class="btn btn-danger btn-sm">Delete</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

</body>
</html>
