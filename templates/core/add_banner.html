<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Banner</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h1>Edit Banner</h1>

    <!-- Banner Form -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <!-- Title Field -->
        <div class="form-group">
            <label for="id_title">Title:</label>
            <input type="text" class="form-control" id="id_title" name="title" value="{{ banner.title }}" required>
        </div>

        <!-- Subtitle Field -->
        <div class="form-group">
            <label for="id_subtitle">Subtitle:</label>
            <input type="text" class="form-control" id="id_subtitle" name="subtitle" value="{{ banner.subtitle }}">
        </div>

        <!-- Current Image Display -->
        <div class="form-group">
            <label>Banner Image:</label><br>
            <p>Currently: {{ banner.image.url }}</p>
            <p><strong>Change: </strong> <input type="file" name="image"></p>
        </div>

        <!-- Created At (Display only, not editable) -->
        <div class="form-group">
            <label>Created At:</label>
            <p>{{ banner.created_at|date:"b. d, Y, H:i a" }}</p>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
    </form>

    <br>
    <a href="{% url 'custom_admin_dashboard' %}" class="btn btn-secondary">Back to Admin Dashboard</a>
</div>

</body>
</html>
